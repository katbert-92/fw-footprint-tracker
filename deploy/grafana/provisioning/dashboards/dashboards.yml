# Picks up whatever fwtrack-dash wrote into deploy/grafana/dashboards/.
#
# foldersFromFilesStructure puts each project in its own Grafana folder, which
# is where per-project permissions are granted -- a dashboard variable would be
# a filter, not a boundary.

apiVersion: 1

providers:
  - name: fwtrack
    type: file
    # Editable so layouts can be worked out by hand. The generator still owns
    # the file: regenerating rewrites it and the provider then discards whatever
    # was changed here. Export anything worth keeping and port it back into the
    # generator, or Save As for a private copy the generator never touches.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
