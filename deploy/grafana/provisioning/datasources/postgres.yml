# Datasource is created on startup, so a fresh container needs no clicking.
# Values come from the environment set in docker-compose.yml.

apiVersion: 1

datasources:
  - name: fwtrack
    # Fixed uid: generated dashboards reference the datasource by uid, so it has
    # to stay the same across recreations of the container.
    uid: fwtrack-postgres
    type: postgres
    access: proxy
    url: ${FWTRACK_DB_HOST}
    user: ${FWTRACK_DB_USER}
    isDefault: true
    editable: false
    jsonData:
      # Grafana 11 moved the database name into jsonData. The top level
      # `database:` field is still accepted but the variable query path no
      # longer reads it, which shows up as "no default database configured"
      # on every template variable while panels keep working.
      database: ${FWTRACK_DB_NAME}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${FWTRACK_DB_PASSWORD}
