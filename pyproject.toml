[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fw-footprint-tracker"
version = "0.1.0"
description = "Track embedded firmware memory footprint (Flash/RAM) across builds, and visualize per-branch trends in Grafana"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "katbert-92" }]
keywords = ["embedded", "firmware", "elf", "memory", "footprint", "grafana"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyelftools>=0.32",
    "tabulate>=0.9.0",
    "coloredlogs>=15.0.1",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/katbert-92/fw-footprint-tracker"
Issues = "https://github.com/katbert-92/fw-footprint-tracker/issues"

[project.scripts]
fwtrack = "fwtrack.cli:main"
fwtrack-analyse = "fwtrack.analyse:main"
fwtrack-push = "fwtrack.track:main"
fwtrack-dash = "fwtrack.grafana.gen_dashboard:main"
fwtrack-init = "fwtrack.init:main"
fwtrack-server = "fwtrack.server:main"

[tool.setuptools.packages.find]
include = ["fwtrack*"]

[tool.ruff]
line-length = 100
