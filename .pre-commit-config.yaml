# Once per clone:  pre-commit install
#
# ruff is both the linter and the formatter here, so there is no second tool to
# keep in step: the line length lives in pyproject.toml and applies to each.
# Lint first, then format -- a fix that changes a line still gets laid out.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--fix"]

      - id: ruff-format

  # Scans what is about to be committed. .env is gitignored and never staged,
  # so the secrets that matter here are the ones pasted into a file by mistake.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        name: gitleaks (protect staged)
        entry: gitleaks protect
        args:
          - "--staged"
          - "--no-banner"
          - "--verbose"
          - "--redact"
          - "--config=.gitleaks.toml"

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

      # pre-commit run markdownlint-fix --all-files --hook-stage manual
      - id: markdownlint-fix
        args: ["--config", ".markdownlint.json", "--fix"]
        stages: [manual]
