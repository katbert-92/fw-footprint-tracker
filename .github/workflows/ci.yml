name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The oldest the package supports, so nothing newer slips in.
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      GRAFANA_ADMIN_PASSWORD: ci
      FWTRACK_INGEST_TOKEN: ci
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck fwtrack.sh
      - run: docker compose config --quiet
      - run: docker build --tag fwtrack-ingest .
